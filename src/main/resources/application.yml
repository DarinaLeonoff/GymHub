spring:
  datasource:
    url: jdbc:postgresql://localhost:6543/gymhub
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

logging:
  level:
    org.flywaydb: INFO

jwt:
  secret: ${JWT_SECRET}