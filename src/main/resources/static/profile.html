
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль зала | GymHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="header">
    <h1>GymHub</h1>
    <a href="/" class="back-link">На главную</a>
</header>

<main class="main">
    <div id="loading">Загрузка профиля...</div>

    <div id="profile" class="profile-card hidden">
        <div class="profile-header">
            <h2 id="gym-name"></h2>
            <span id="gym-id" class="gym-id"></span>
            <button id="edit-gym-btn" class="icon-button"
                    type="button" title="Редактировать профиль">
                ✎
            </button>
        </div>

        <section class="profile-section">
            <h3>Описание</h3>
            <p id="gym-description"></p>
        </section>

        <section class="profile-section">
            <h3>Контактная информация</h3>

            <div class="profile-field">
                <span>Адрес</span>
                <p id="gym-address"></p>
            </div>

            <div class="profile-field">
                <span>Телефон</span>
                <p id="gym-tel"></p>
            </div>

            <div class="profile-field">
                <span>Email</span>
                <p id="gym-email"></p>
            </div>
        </section>
    </div>

    <div id="error-message" class="error-message hidden"></div>
</main>

<div id="edit-modal" class="modal hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Редактирование профиля</h2>
            <button id="close-edit-modal" class="close-button"
                    type="button">&times;</button>
        </div>

        <form id="edit-gym-form">
            <label for="edit-name">Название</label>
            <input type="text" id="edit-name" maxlength="50">

            <label for="edit-description">Описание</label>
            <textarea id="edit-description"
                      maxlength="500" rows="3"></textarea>

            <label for="edit-address">Адрес</label>
            <input type="text" id="edit-address" maxlength="500">

            <label for="edit-tel">Телефон</label>
            <input type="tel" id="edit-tel">

            <label for="edit-email">Email</label>
            <input type="email" id="edit-email">

            <p id="edit-message" class="form-message"></p>

            <div class="form-actions">
                <button type="button" id="cancel-edit"
                        class="secondary-button">
                    Отмена
                </button>

                <button type="submit" class="primary-button">
                    Сохранить изменения
                </button>
            </div>
        </form>
    </div>
</div>

<script src="/js/profile.js"></script>
</body>
</html>
