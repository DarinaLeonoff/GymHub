spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gym-db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        javax.persistence.validation.mode: none
      show-sql: true

  flyway:
    enabled: true