version: '3.8'

services:
  # База данных для Auth Gateway
  auth-db:
    image: postgres:16-alpine
    container_name: gymhub-auth-db
    environment:
      POSTGRES_DB: gymhub_auth_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d gymhub_auth_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Сервис авторизации и шлюза
  auth-gateway:
    build:
      context: .
      dockerfile: authGateway/dockerfile
    container_name: gymhub-auth-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/gymhub_auth_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      SPRING_DATA_REDIS_HOST: auth-redis
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      auth-db:
        condition: service_healthy
      auth-redis:
        condition: service_healthy

  auth-redis:
    image: redis:7-alpine
    container_name: gymhub-auth-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  auth_db_data: